<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      width: 260px;
      background: #0f0f0f;
      color: #fff;
      font-family: ui-monospace, "SF Mono", Menlo, Monaco, monospace;
      padding: 20px;
      box-sizing: border-box;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .label {
      font-size: 13px;
      letter-spacing: 0.02em;
    }
    .sub {
      font-size: 10px;
      opacity: 0.45;
      margin-top: 6px;
      letter-spacing: 0.04em;
    }
    /* iOS-style toggle */
    .switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.15);
      border-radius: 999px;
      transition: background 0.2s ease;
      cursor: pointer;
    }
    .slider::before {
      content: "";
      position: absolute;
      height: 20px; width: 20px;
      left: 3px; top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }
    input:checked + .slider { background: #4ac36a; }
    input:checked + .slider::before { transform: translateX(20px); }
  </style>
</head>
<body>
  <div class="row">
    <span class="label" id="status">Effects on</span>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>
  <div class="sub">Reloads YouTube, keeps your place in the video.</div>
  <script src="popup.js"></script>
</body>
</html>
